# Dependency + pin updates (plan §9.4). Cooldown mirrors pnpm's minimumReleaseAge.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Types must match the Node 24 LTS runtime (ADR-015).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # TypeScript 7 is unsupported by typescript-eslint (ADR-015); revisit when it lands.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: 'chore(ci)'

  - package-ecosystem: docker
    directory: /infra/docker
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # Stay on Node LTS (even majors). Digest/patch updates still come through.
      - dependency-name: 'node'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: 'chore(docker)'

  - package-ecosystem: docker-compose
    directory: /infra/compose
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'chore(docker)'
