# Nightly DAST (plan §18.3). CI already re-runs the static and dependency gates on a
# schedule; this is the half that needs a *running* application: ZAP drives the real stack
# the same way a stranger would.
#
# Anything ZAP reports that is not justified in .zap/rules.tsv fails the run.
name: nightly

on:
  schedule:
    - cron: '0 8 * * *' # an hour after the ci re-scan, so they do not queue against each other
  workflow_dispatch:

permissions: {}

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

env:
  LEFTHOOK: '0'
  TURBO_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'
  ZAP_IMAGE: ghcr.io/zaproxy/zaproxy:stable@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef
  # Pinned exactly, like every other tool that can fail a build (SR-0.10). Dependabot does
  # not watch pipx installs, so this one is bumped by hand when the fuzzer is updated.
  SCHEMATHESIS_VERSION: '4.27.5'

jobs:
  dast:
    name: dast (zap baseline, web + api)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: start the stack
        run: |
          set -euo pipefail
          pnpm env:init
          for attempt in 1 2 3; do
            if docker compose --env-file .env -f infra/compose/docker-compose.dev.yml \
                 --profile mail pull --quiet; then
              break
            fi
            echo "image pull failed (attempt ${attempt}); retrying"
            sleep $((attempt * 10))
          done
          docker compose --env-file .env -f infra/compose/docker-compose.dev.yml \
            --profile mail up -d --wait
          pnpm db:migrate
          pnpm db:seed

      # Scan what ships, not what the dev server serves: the dev build has a relaxed CSP
      # and extra tooling, so a scan of it would be scanning something we never deploy.
      - name: build and start api + web (production)
        run: |
          set -euo pipefail
          pnpm --filter @gth/api build
          pnpm --filter @gth/web build
          cp -r apps/web/.next/static apps/web/.next/standalone/apps/web/.next/static
          set -a
          # shellcheck disable=SC1091,SC1094
          . ./.env
          set +a
          # The per-IP limit is raised for the scanned instance, on purpose.
          #
          # Everything below comes from one address, and schemathesis sends roughly nine
          # hundred requests in ten seconds. At the production default of 120 a minute, most
          # of them were answered 429 and never reached the application at all: measured, the
          # "schema validation mismatch" warning named 8 operations at 120 and 1 with the
          # limit out of the way. The fuzzer was spending its budget on the rate limiter.
          #
          # The limiter itself is not going untested by this — it has its own unit tests, and
          # `apps/api/src/routes/auth-limits.test.ts` covers the per-user and per-address
          # halves. What a fuzzer is for is the code behind it.
          NODE_ENV=production API_RATE_LIMIT_MAX=1000000 node apps/api/dist/index.js > /tmp/api.log 2>&1 &
          NODE_ENV=production PORT=3000 HOSTNAME=0.0.0.0 \
            node apps/web/.next/standalone/apps/web/server.js > /tmp/web.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:4000/healthz >/dev/null && curl -sf http://127.0.0.1:3000/ >/dev/null; then
              echo "servers up"; exit 0
            fi
            sleep 2
          done
          echo "servers failed to start"; tail -n 50 /tmp/api.log /tmp/web.log; exit 1

      - name: prepare zap workspace
        run: |
          mkdir -p "${RUNNER_TEMP}/zap"
          cp .zap/rules.tsv "${RUNNER_TEMP}/zap/rules.tsv"
          # The ZAP container runs as its own user and needs to write reports here.
          chmod 777 "${RUNNER_TEMP}/zap"

      - name: zap baseline - web app
        run: |
          docker run --rm --network host \
            -v "${RUNNER_TEMP}/zap":/zap/wrk/:rw "${ZAP_IMAGE}" \
            zap-baseline.py -t http://127.0.0.1:3000 \
              -c rules.tsv -J web.json -r web.html

      - name: zap baseline - api
        run: |
          docker run --rm --network host \
            -v "${RUNNER_TEMP}/zap":/zap/wrk/:rw "${ZAP_IMAGE}" \
            zap-baseline.py -t http://127.0.0.1:4000/healthz \
              -c rules.tsv -J api.json -r api.html

      # The public API is described by a document, so it can be fuzzed against that document
      # rather than against a list of URLs someone remembered to update (AC-3.4). Schemathesis
      # generates inputs from the schemas and fails on any 5xx or any response that does not
      # match what the spec promises -- which is the pair of properties a published API has to
      # hold if anyone is going to build on it.
      #
      # **What this does not reach.** The document describes eight read-only GETs, and this
      # run carries no session, so the API's twenty-nine authenticated write routes are
      # invisible to it. That is exactly where six 5xx bugs were sitting until they were found
      # by hand (#64). The "no 5xx" half of AC-3.4 is therefore also enforced from inside the
      # test suite, where sessions already work: `apps/api/src/routes/no-5xx.test.ts`, which
      # fails if a write route is added without being listed in it.
      #
      # It reached even less than that until 2026-09-25: the API was started on the production
      # per-IP limit, so most of these requests were answered 429 by us rather than tested.
      # The limit is raised for the scanned instance now — see the note where it is started.
      - name: schemathesis - fuzz /v1 against its own spec
        run: |
          curl -fsS http://127.0.0.1:4000/docs/openapi.json -o "${RUNNER_TEMP}/openapi.json"
          pipx install "schemathesis==${SCHEMATHESIS_VERSION}"
          schemathesis run "${RUNNER_TEMP}/openapi.json" \
            --url http://127.0.0.1:4000 \
            --checks all \
            --max-examples 40 \
            --report junit \
            --report-junit-path "${RUNNER_TEMP}/zap/schemathesis.xml"

      - if: failure()
        run: tail -n 100 /tmp/api.log /tmp/web.log || true

      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zap-reports
          path: ${{ runner.temp }}/zap
          retention-days: 30
          if-no-files-found: warn

  # This scan failed three nights running in September and told nobody, because a failed
  # workflow announces itself only to whoever opens GitHub that day.
  report:
    name: report a failure
    needs: [dast]
    if: failure()
    # `./` is the form GitHub documents and every version of Actions understands. `$/` is
    # newer, and a reusable-workflow reference that does not resolve would fail at exactly the
    # moment this job exists to report a failure.
    uses: ./.github/workflows/notify-ops.yml # zizmor: ignore[self-repository]
    with:
      what: nightly security scan failed (ZAP baseline or /v1 fuzzing)
    secrets:
      webhook: ${{ secrets.DISCORD_OPS_WEBHOOK_URL }}
