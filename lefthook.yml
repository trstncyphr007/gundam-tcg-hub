# Local guardrails (plan §9.3). CI re-runs every check, so --no-verify only defers failures.
pre-commit:
  parallel: true
  commands:
    gitleaks:
      run: gitleaks git --pre-commit --staged --redact --no-banner
    eslint:
      glob: '*.{ts,tsx,js,mjs,cjs}'
      run: pnpm exec eslint --max-warnings=0 --no-warn-ignored {staged_files}
    prettier:
      glob: '*.{ts,tsx,js,mjs,cjs,json,md,yml,yaml}'
      run: pnpm exec prettier --check {staged_files}
    exec-bits:
      # Editing a script from the Windows side drops its mode to 644, and CI has caught that
      # six times in six pull requests. CI is the wrong place to find it: by then the commit
      # exists and the fix is another commit. Here it is a message before the commit lands.
      glob: '*.sh'
      run: bash scripts/check-exec-bits.sh
    shellcheck:
      # Same severity as CI. The shell in this repo deploys, backs up and decides whether the
      # server is ready, and it was the only language here with no linter at all.
      glob: '*.sh'
      run: shellcheck --severity=warning {staged_files}

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

pre-push:
  commands:
    protect-main:
      # GitHub Free + private repo has no branch protection (ADR-014): guard locally.
      use_stdin: true
      run: bash scripts/hooks/protect-main.sh
    typecheck-test:
      run: pnpm typecheck && pnpm test
