# Repo-specific Semgrep rules, run alongside the p/typescript, p/nodejs,
# p/owasp-top-ten and p/secrets registry rulesets (plan §18.2).
rules:
  - id: gth-no-sql-raw
    languages: [typescript, javascript]
    severity: ERROR
    message: sql.raw() bypasses parameterized queries (SR-X.11). Use the sql`` template instead.
    pattern: sql.raw(...)
    paths:
      exclude:
        - packages/db/migrations/**

  - id: gth-no-child-process
    languages: [typescript, javascript]
    severity: ERROR
    message: child_process is banned in app code (SR-X.13).
    pattern-regex: (from|require\()\s*['"](node:)?child_process['"]
    paths:
      exclude:
        - scripts/**

  - id: gth-no-dynamic-code
    languages: [typescript, javascript]
    severity: ERROR
    message: Dynamic code execution is banned.
    pattern-either:
      - pattern: eval(...)
      - pattern: new Function(...)

  - id: gth-no-outbound-http
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      Server code makes no outbound HTTP requests except the Discord webhook transport, which
      is host-allowlisted and refuses redirects (SR-1.1, ADR-030). A new outbound request is an
      SSRF surface: it needs its own allowlist, a redirect policy and, if the host can be
      chosen by a user, resolved-address checks against DNS rebinding. Add it to that module,
      or change this rule on purpose.
    pattern-either:
      - pattern: fetch(...)
      - pattern: globalThis.fetch
      - pattern-regex: (from|require\()\s*['"](node:)?(http|https|http2|dgram)['"]
      - pattern-regex: (from|require\()\s*['"](undici|axios|got|node-fetch|superagent)['"]
      # An SDK is an outbound request with a nicer name. `stripe` reaches api.stripe.com the
      # moment it is constructed with a key, and this rule enumerated HTTP *libraries* rather
      # than outbound capability — so it would have let an entire payment integration in
      # without saying a word. Named here so the exception below has to be taken on purpose,
      # which is what ADR-030 asks for: "add it to that module, or change this rule on
      # purpose."
      - pattern-regex: (from|require\()\s*['"]stripe['"]
      # A raw socket is an outbound request with no URL at all. The virus scanner speaks its
      # own protocol over TCP, which this rule would have missed entirely for the same reason
      # it missed the Stripe SDK: it enumerated HTTP libraries rather than outbound capability.
      #
      # Named imports only, and only the ones that open a connection. `node:net` also exports
      # `isIP`, which is a pure predicate used by the IP-hashing helper and the config loader —
      # matching the whole module flagged both of them for doing nothing of the kind.
      - pattern-regex: import\s*\{[^}]*\b(connect|createConnection|createServer|Socket)\b[^}]*\}\s*from\s*['"](node:)?(net|tls)['"]
      - pattern-regex: import\s+\*\s+as\s+\w+\s+from\s*['"](node:)?(net|tls)['"]
      - pattern-regex: require\(\s*['"](node:)?(net|tls)['"]\s*\)
    paths:
      include:
        - apps/api/src/**
        - packages/*/src/**
      exclude:
        - packages/alerts/src/transports.ts
        # The one module allowed to talk to Stripe (Phase 5). Fixed host, official SDK, and no
        # user-supplied URL anywhere in it — so the questions this rule exists to ask have the
        # same answer they have for the Discord transport: there is nothing to point at.
        - apps/api/src/payments/stripe.ts
        # Object storage (Phase 5, slice 4). Endpoint and bucket from configuration, object
        # keys built from ids we generated, redirects refused outright. Same answer again.
        - packages/photos/src/storage.ts
        # The virus scanner, over TCP to a host from configuration. It sends bytes and reads a
        # verdict; there is no URL and nothing a request can steer.
        - packages/photos/src/scanner.ts
        - '**/*.test.ts'
        - packages/db/src/test/**

  - id: gth-no-tls-verification-bypass
    languages: [typescript, javascript]
    severity: ERROR
    message: Never disable TLS certificate verification (SR-X.19).
    pattern-either:
      - pattern-regex: NODE_TLS_REJECT_UNAUTHORIZED
      - pattern: '{..., rejectUnauthorized: false, ...}'
