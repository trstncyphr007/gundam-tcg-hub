# Production stack (plan §19.2). Only Caddy publishes ports; everything else sits on
# internal networks. Run with an env file that SOPS decrypted to tmpfs:
#   docker compose --env-file /run/gth/prod.env -f docker-compose.prod.yml up -d --wait
name: gth-prod

x-hardening: &hardening
  read_only: true
  tmpfs: ['/tmp:size=64m,mode=1777']
  security_opt: ['no-new-privileges:true']
  cap_drop: ['ALL']
  restart: unless-stopped
  logging:
    driver: local
    options: { max-size: '10m', max-file: '5' }

services:
  caddy:
    <<: *hardening
    image: caddy:2-alpine
    # Needs to bind 80/443 and write certificates.
    read_only: false
    cap_drop: ['ALL']
    cap_add: ['NET_BIND_SERVICE']
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set the public hostname}
      ACME_EMAIL: ${ACME_EMAIL:?set an ACME contact address}
      CADDY_GLOBAL_EXTRA: ${CADDY_GLOBAL_EXTRA:-}
    volumes:
      # Same story as the database's init directory below: ../caddy/Caddyfile is right in the
      # repository and wrong on the server, where the Caddyfile is shipped alongside this file.
      - ${CADDYFILE:-../caddy/Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    depends_on:
      web: { condition: service_healthy }
      api: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: '0.50', memory: 256M, pids: 256 }

  web:
    <<: *hardening
    image: ${WEB_IMAGE:?set WEB_IMAGE to a signed digest}
    user: '65532:65532'
    # Next writes its rendered-page cache under .next/cache, and the filesystem is read-only
    # by design. Without somewhere to put it every render logs an ENOENT, which is noise that
    # would hide a real error — and the noise is what a log nobody trusts is made of. In
    # memory, so it is still gone when the container is.
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/apps/web/.next/cache:size=64m,mode=0700,uid=65532,gid=65532
    environment:
      NODE_ENV: production
      PORT: '3000'
      HOSTNAME: 0.0.0.0
      # Read by next.config.ts, which `output: 'standalone'` evaluates at build time — so this
      # does NOT reach the rewrites. It stays because it is right, and because anything added
      # later that reads it at runtime will need it. Production routing is Caddy's job
      # (infra/caddy/Caddyfile), which is why /docs is routed there rather than through Next.
      API_INTERNAL_URL: http://api:4000
    networks: [edge, internal]
    deploy:
      resources:
        limits: { cpus: '1.0', memory: 512M, pids: 256 }

  api:
    <<: *hardening
    image: ${API_IMAGE:?set API_IMAGE to a signed digest}
    user: '65532:65532'
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      API_HOST: 0.0.0.0
      API_PORT: '4000'
      # Behind Caddy, which overwrites X-Forwarded-For (see Caddyfile).
      API_TRUST_PROXY: 'true'
      API_BASE_URL: ${API_BASE_URL:?}
      APP_BASE_URL: ${APP_BASE_URL:?}
      DATABASE_URL_READONLY: ${DATABASE_URL_READONLY:?}
      DATABASE_URL_WEB: ${DATABASE_URL_WEB:?}
      DATABASE_URL_WORKER: ${DATABASE_URL_WORKER:?}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?}
      TOKEN_PEPPER: ${TOKEN_PEPPER:?}
      # Without these the API falls back to its development key and refuses to start.
      DATA_ENCRYPTION_KEYS: ${DATA_ENCRYPTION_KEYS:?}
      DATA_ENCRYPTION_ACTIVE_KID: ${DATA_ENCRYPTION_ACTIVE_KID:?}
      # Required, not defaulted: a `localhost` relying party on a real domain would boot and
      # then refuse every passkey, locking admins out of the console (ADR-025).
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:?}
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:?}
      WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-Gundam TCG Hub}
      SMTP_URL: ${SMTP_URL:?production refuses to start without SMTP}
      EMAIL_FROM: ${EMAIL_FROM:?}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      DISCORD_ALERT_WEBHOOK_URL: ${DISCORD_ALERT_WEBHOOK_URL:-}
    # edge: Caddy proxies /v1 and /api/auth straight here, so the API sees the client IP
    # that Caddy sets. internal: databases. egress: outbound calls (SMTP, Discord).
    networks: [edge, internal, egress]
    depends_on:
      postgres: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: '1.0', memory: 512M, pids: 256 }

  # One-off: `docker compose --profile migrate run --rm migrator`
  # Uses the same image as the API, but the app_migrator role and the DDL entry point.
  migrator:
    <<: *hardening
    profiles: [migrate]
    image: ${API_IMAGE:?set API_IMAGE to a signed digest}
    user: '65532:65532'
    command: ['dist/migrate.js']
    environment:
      NODE_ENV: production
      DATABASE_URL_MIGRATOR: ${DATABASE_URL_MIGRATOR:?}
    networks: [internal]
    restart: 'no'
    depends_on:
      postgres: { condition: service_healthy }

  # The two nightly jobs (docs/runbooks/scheduled-jobs.md), run by systemd timers:
  #   docker compose --profile jobs run --rm retention
  #   docker compose --profile jobs run --rm rollup
  #
  # Same image as the API, so they are the code that was built, scanned and signed. They run
  # on the app_worker role, whose grants are the point: it can do these jobs and nothing else.
  # `restart: 'no'` because a one-off that failed should stay failed and alert, not loop.
  #
  # Neither needs the encryption keys: erasing a buyer handle clears the ciphertext column
  # without reading it, which is the property migration 0024 was built for.
  retention:
    <<: *hardening
    profiles: [jobs]
    image: ${API_IMAGE:?set API_IMAGE to a signed digest}
    user: '65532:65532'
    command: ['dist/job-retention.js']
    environment:
      NODE_ENV: production
      DATABASE_URL_WORKER: ${DATABASE_URL_WORKER:?}
    networks: [internal]
    restart: 'no'
    depends_on:
      postgres: { condition: service_healthy }

  rollup:
    <<: *hardening
    profiles: [jobs]
    image: ${API_IMAGE:?set API_IMAGE to a signed digest}
    user: '65532:65532'
    command: ['dist/job-rollup.js']
    environment:
      NODE_ENV: production
      DATABASE_URL_WORKER: ${DATABASE_URL_WORKER:?}
    networks: [internal]
    restart: 'no'
    depends_on:
      postgres: { condition: service_healthy }

  # Every quarter of an hour: is anything worth waking somebody for? Needs `egress` as well,
  # because unlike the other two it talks to Discord. Unset webhook is not an error — it
  # prints what it would have said (ADR-038).
  watchdog:
    <<: *hardening
    profiles: [jobs]
    image: ${API_IMAGE:?set API_IMAGE to a signed digest}
    user: '65532:65532'
    command: ['dist/job-watchdog.js']
    environment:
      NODE_ENV: production
      DATABASE_URL_WORKER: ${DATABASE_URL_WORKER:?}
      DISCORD_OPS_WEBHOOK_URL: ${DISCORD_OPS_WEBHOOK_URL:-}
    networks: [internal, egress]
    restart: 'no'
    depends_on:
      postgres: { condition: service_healthy }

  # Every few minutes: send the alerts we still owe (FR-1.8). Fan-out runs inside the
  # scanner's own request and gets one pass, so a Discord 429 or an SMTP hiccup used to lose
  # the alert for good — and silently, because a failed row was a number nobody read. Needs
  # `egress` for the same reason the watchdog does.
  alert-retry:
    <<: *hardening
    profiles: [jobs]
    image: ${API_IMAGE:?set API_IMAGE to a signed digest}
    user: '65532:65532'
    command: ['dist/job-alert-retry.js']
    environment:
      NODE_ENV: production
      DATABASE_URL_WORKER: ${DATABASE_URL_WORKER:?}
      # The same transports as the first attempt, built from the same values: a retry that
      # goes out a different way is not a retry.
      SMTP_URL: ${SMTP_URL:-}
      EMAIL_FROM: ${EMAIL_FROM:?}
      APP_BASE_URL: ${APP_BASE_URL:?}
      DISCORD_ALERT_WEBHOOK_URL: ${DISCORD_ALERT_WEBHOOK_URL:-}
      # The retried email carries the same signed unsubscribe link as the first attempt, which
      # needs the API's public address to point at and the pepper to sign with (SR-1.12). Both
      # were missing: the pepper would have fallen back to its development default, which
      # `loadConfig` refuses in production, so the job crashed on startup every five minutes —
      # and the address would have put `127.0.0.1` in an email if it had not.
      API_BASE_URL: ${API_BASE_URL:?}
      TOKEN_PEPPER: ${TOKEN_PEPPER:?}
    networks: [internal, egress]
    restart: 'no'
    depends_on:
      postgres: { condition: service_healthy }

  # Finish delivered orders whose hold window has passed (FR-5.4, FR-5.6). This is the `system`
  # actor the order state machine talks about — the clock, and nothing else.
  #
  # It is the only path from `delivered` to `completed` that does not involve an admin, and it
  # exists because neither party may finish their own sale. If this never runs, sellers are
  # never paid out and nothing anywhere reports an error: the orders simply sit in `delivered`.
  #
  # `internal` only: it talks to Postgres and to nothing else.
  complete-orders:
    <<: *hardening
    profiles: [jobs]
    image: ${API_IMAGE:?set API_IMAGE to a signed digest}
    user: '65532:65532'
    command: ['dist/job-complete-orders.js']
    environment:
      NODE_ENV: production
      # The worker role, which is the only one that can write `completed` at all. Wired to the
      # web role by mistake, every statement would be refused rather than quietly succeeding.
      DATABASE_URL_WORKER: ${DATABASE_URL_WORKER:?}
    networks: [internal]
    restart: 'no'
    depends_on:
      postgres: { condition: service_healthy }

  postgres:
    <<: *hardening
    image: postgres:17-bookworm@sha256:639ab7ceb90e13123085b741fb31ef493fba25463002f6da665352e7b534b652
    # Postgres manages its own permissions and needs a writable data dir.
    read_only: false
    cap_drop: ['ALL']
    cap_add: ['CHOWN', 'DAC_OVERRIDE', 'FOWNER', 'SETGID', 'SETUID']
    environment:
      POSTGRES_USER: ${PG_SUPERUSER:?}
      POSTGRES_PASSWORD: ${PG_SUPERPASSWORD:?}
      POSTGRES_DB: ${PG_DATABASE:-gth}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      PG_MIGRATOR_PASSWORD: ${PG_MIGRATOR_PASSWORD:?}
      PG_WEB_PASSWORD: ${PG_WEB_PASSWORD:?}
      PG_WORKER_PASSWORD: ${PG_WORKER_PASSWORD:?}
      PG_READONLY_PASSWORD: ${PG_READONLY_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Relative paths in a compose file resolve against the file's own directory. In the
      # repository that is `infra/compose`; on the server the file sits alone in
      # /srv/gth/<env>, where `../../packages/db/init` does not exist — Docker would create an
      # empty directory, Postgres would start with **no roles**, and the first migration would
      # fail with "password authentication failed". deploy.sh sets these to the shipped copies;
      # the defaults keep `scripts/verify-prod-stack.sh` working from the repository.
      - ${DB_INIT_DIR:-../../packages/db/init}:/docker-entrypoint-initdb.d:ro
    # No ports: reachable only from the internal network.
    networks: [internal]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits: { cpus: '1.0', memory: 1G, pids: 512 }

  # No Valkey (ADR-042). It ran here with a password, a persistent volume, and four
  # capabilities added back so it could take ownership of its data directory — and not one
  # line of code anywhere connecting to it.
  #
  # The cost was never the memory. `deploy.sh` brings the stack up with `--wait`, which waits
  # on *every* service, so a Valkey that failed to start — a bad pull, a corrupt append-only
  # file, a full disk — would have failed the deploy and rolled back a healthy release. An
  # unused dependency was load-bearing for availability and for nothing else.

networks:
  # Public-facing: only Caddy and the two app services.
  edge: {}
  # No route off the host: databases live here.
  internal:
    internal: true
  # Outbound only, for the API's third-party calls (Discord, SMTP, Stripe later).
  egress: {}

volumes:
  pgdata: {}
  caddy_data: {}
  caddy_config: {}
