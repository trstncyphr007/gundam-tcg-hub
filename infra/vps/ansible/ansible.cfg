[defaults]
inventory = inventory.ini
roles_path = roles
host_key_checking = True
# Show what changed, not just that something did: a diff in the log is the difference
# between "the play ran" and "here is what it did to the server".
stdout_callback = yaml
callbacks_enabled = profile_tasks
interpreter_python = auto_silent
retry_files_enabled = False

[ssh_connection]
pipelining = True
