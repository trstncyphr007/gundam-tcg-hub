[defaults]
inventory = inventory.ini
roles_path = roles
host_key_checking = True
# Show what changed, not just that something did: a diff in the log is the difference
# between "the play ran" and "here is what it did to the server".
#
# The built-in callback with YAML results, not `community.general.yaml`: that plugin was
# removed in community.general 12, which requirements.yml pins — so the old setting made the
# playbook fail on its first line with exactly the collections this repo asks for.
stdout_callback = ansible.builtin.default
result_format = yaml
callbacks_enabled = ansible.posix.profile_tasks
interpreter_python = auto_silent
retry_files_enabled = False

[ssh_connection]
pipelining = True
