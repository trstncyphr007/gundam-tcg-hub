# Copy to inventory.ini (gitignored) and fill in.
#
# Use the Tailscale hostname once Tailscale is up: SSH stops listening on the public
# interface at that point, and an inventory pointing at the public IP would be a reminder of
# a door we deliberately closed.
[vps]
gth-prod ansible_host=CHANGE-ME.tailnet-name.ts.net

[vps:vars]
ansible_user=deploy
ansible_python_interpreter=/usr/bin/python3
