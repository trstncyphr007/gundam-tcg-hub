---
- name: Install the SSH server
  ansible.builtin.apt:
    name: openssh-server
    state: present

- name: Ensure the drop-in directory exists
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Confirm sshd actually reads the drop-in directory
  # Ubuntu 24.04 ships `Include /etc/ssh/sshd_config.d/*.conf` at the top of sshd_config. If
  # that line were ever absent, everything below would be written, validated, and never read
  # — a hardening file that exists and does nothing is worse than no file, because it reads
  # as done. Check rather than assume.
  ansible.builtin.command:
    cmd: grep -qE '^\s*Include\s+/etc/ssh/sshd_config\.d/' /etc/ssh/sshd_config
  register: ssh_include
  changed_when: false
  failed_when: ssh_include.rc != 0

- name: Harden the SSH daemon
  # A drop-in rather than edits to sshd_config: an upgrade can replace the distribution file
  # without quietly reverting any of this, and the whole policy is one readable file.
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/50-gth-hardening.conf
    mode: '0600'
    owner: root
    group: root
    content: |
      # Managed by Ansible (infra/vps/ansible/roles/ssh).
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      ChallengeResponseAuthentication no
      PermitEmptyPasswords no
      AuthenticationMethods publickey
      MaxAuthTries 3
      MaxSessions 4
      LoginGraceTime 20
      AllowUsers {{ deploy_user }}
      X11Forwarding no
      AllowAgentForwarding no
      AllowTcpForwarding no
      # Modern algorithms only. Anything older is either broken or only useful to something
      # that should not be connecting to this host.
      KexAlgorithms curve25519-sha256,curve25519-sha256@libssh.org,sntrup761x25519-sha512@openssh.com
      Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com
      MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com
      HostKeyAlgorithms ssh-ed25519,ssh-ed25519-cert-v01@openssh.com,rsa-sha2-512,rsa-sha2-256
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh

- name: Remove weak host keys
  # An unused DSA/ECDSA host key is one more thing that can be downgraded to.
  ansible.builtin.file:
    path: '{{ item }}'
    state: absent
  loop:
    - /etc/ssh/ssh_host_dsa_key
    - /etc/ssh/ssh_host_dsa_key.pub
    - /etc/ssh/ssh_host_ecdsa_key
    - /etc/ssh/ssh_host_ecdsa_key.pub
  notify: Restart ssh
