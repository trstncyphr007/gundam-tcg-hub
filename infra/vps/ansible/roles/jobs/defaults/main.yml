---
# The nightly jobs, their schedule, and what they are for. Times are UTC and deliberately
# apart: the rollup reads what the day produced, retention deletes on a clock of its own, and
# neither should be inside the backup window (03:00).
jobs_schedule:
  - name: rollup
    description: Gundam TCG Hub price rollup
    hour: '03:30:00'
  - name: retention
    description: Gundam TCG Hub data retention
    hour: '04:30:00'
  # Not nightly: the point of a watchdog is noticing within the quarter-hour, not the day.
  - name: watchdog
    description: Gundam TCG Hub ops watchdog
    hour: '*:0/15:00'
  # Every five minutes, and the one job where the spreading jitter is worth shrinking: this
  # sends alerts somebody is already waiting for (FR-1.8). A restock alert is worth a lot in
  # the first minutes and much less later, so it runs often and starts promptly.
  - name: alert-retry
    description: Gundam TCG Hub alert retry
    hour: '*:0/5:00'
    delay: 15
